name: Publish package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify package
        run: |
          moon version --all
          moon update
          moon fmt --check
          moon info --target all
          git diff --exit-code
          moon check --fmt --deny-warn --target all
          moon build --target all
          moon test --deny-warn --target all

      - name: Publish
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        shell: bash
        run: |
          test -n "$MOONCAKES_TOKEN"
          mkdir -p "$HOME/.moon"
          printf '{"token":"%s"}\n' "$MOONCAKES_TOKEN" > "$HOME/.moon/credentials.json"
          moon publish
          rm -f "$HOME/.moon/credentials.json"
